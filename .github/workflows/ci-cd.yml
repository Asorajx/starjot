# =========================
#   CI/CD Pipeline
# =========================

# CI (continuous integration): every push and pull request is type-checked, tested and built.
# CD (continuous deployment): a push to main also publishes the built site to GitHub Pages.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only access by default; only the deploy job is allowed to publish.
permissions:
  contents: read

# A newer push to the same branch cancels a run that is still in progress.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true


# =========================
#   Jobs
# =========================

jobs:
  check:
    name: Type check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      # The npm cache makes later runs install faster.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci installs the exact versions recorded in package-lock.json.
      - name: Install packages
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The build also generates the dark theme (see "prebuild" in package.json).
      - name: Build
        run: npm run build

      # Only builds from main are handed to the deploy job.
      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
