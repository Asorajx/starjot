<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f9fc" />

  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="fReINYCnhyU7_bZar4XhbidfbAI0zGma7posGsJwJR4" />

  <!-- SEO Description -->
  <meta name="description" content="Organise ideas, write notes and manage tasks, all in one place with Starjot. This is an unfinished prototype, and some features may not work as expected." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- Search Engine Title -->
  <title>Starjot Home (Prototype)</title>
</head>

<body>


  <!-- =========================
       Application Root
       ========================= -->

  <!-- React renders the application here; the message stays visible if the app cannot start. -->
  <div id="app" class="app-root">
    <div class="startup-placeholder" role="status">
      <strong>Opening Starjot…</strong>
      <p>If this message stays visible, run <code>npm install</code> and then <code>npm run dev</code>, and open the address it prints.</p>
    </div>
  </div>
  <noscript>Starjot needs JavaScript for its interface. Notespace data is currently saved only in this browser.</noscript>


  <!-- =========================
       Application Script
       ========================= -->

  <!-- Vite bundles the TypeScript source, starting from src/frontend/main.tsx. -->
  <script type="module" src="/src/frontend/main.tsx"></script>
</body>
</html>
